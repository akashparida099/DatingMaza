{% extends 'main.html' %}

{% block body_block %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7 col-sm-10">
            <div class="card border-0 shadow">
                <!-- Header -->
                <div class="card-header bg-danger text-white text-center py-4">
                    <h2 class="font-weight-bold mb-2">
                        💗 Welcome Back
                    </h2>
                    <p class="mb-0">
                        Login to continue your HeartSync journey
                    </p>
                </div>
                <!-- Login Form -->
                <div class="card-body p-4 p-md-5">
                    <form method="POST">
                        {% csrf_token %}
                        <!-- Username -->
                        <div class="form-group">
                            <label for="username" class="font-weight-bold">
                                👤 Username
                            </label>
                            <input type="text"
                                   name="username"
                                   id="username"
                                   class="form-control form-control-lg"
                                   placeholder="Enter your username"
                                   required>
                        </div>
                        <!-- Password -->
                        <div class="form-group mt-4">
                            <label for="password" class="font-weight-bold">
                                🔐 Password
                            </label>
                            <input type="password"
                                   name="password"
                                   id="password"
                                   class="form-control form-control-lg"
                                   placeholder="Enter your password"
                                   required>

                        </div>
                        <!-- Remember + Forgot Password -->
                        <div class="row mt-3 mb-4">
                            <div class="col-6">
                                <div class="custom-control custom-checkbox">
                                    <input type="checkbox"
                                           class="custom-control-input"
                                           id="remember">
                                    <label class="custom-control-label"
                                           for="remember">
                                        Remember me
                                    </label>
                                </div>
                            </div>
                            <div class="col-6 text-right">
                                <a href="#"
                                   class="text-danger text-decoration-none">
                                    Forgot Password?
                                </a>
                            </div>
                        </div>
                        <!-- Login Button -->
                        <button type="submit"
                                class="btn btn-danger btn-lg btn-block font-weight-bold">
                            💗 Login to HeartSync
                        </button>
                        <div class="text-center mt-4">
                            <small class="text-muted">
                                🔒 Your login information is secure
                            </small>
                        </div>
                    </form>
                </div>
                <!-- Create Account -->
                <div class="card-footer bg-white text-center py-4">

                    <p class="text-muted mb-2">
                        New to HeartSync?
                    </p>
                    <a href="{% url 'create_user' %}"
                       class="btn btn-outline-danger">
                        💕 Create New Account
                    </a>
                </div>
            </div>
            <!-- Bottom Message -->
            <div class="text-center mt-4">
                <small class="text-muted">
                    💗 Connect • Match • Chat • Find Someone Special
                </small>
            </div>
        </div>
    </div>
</div>

{% endblock %}
